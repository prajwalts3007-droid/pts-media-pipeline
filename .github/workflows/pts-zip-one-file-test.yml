name: pts-zip-one-file-test
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  one-file:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Install dependencies
        run: python3 -m pip install --disable-pip-version-check -q 'huggingface_hub>=2.3,<3' 'requests>=2.31,<3'
      - name: Extract the first ZIP entry and publish it directly to bucket
        env:
          PTS_PROBE_GCS_URL: ${{ secrets.PTS_PROBE_GCS_URL }}
          PTS_PROBE_HF_TOKEN: ${{ secrets.PTS_PROBE_HF_TOKEN }}
          HF_HUB_DISABLE_PROGRESS_BARS: '1'
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          set -euo pipefail
          curl -fsSL -o zip_bucket.py "https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/pts_zip_one_file_source.py"
          curl -fsSL -o one_file.py "https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/pts_zip_one_file_test.py"
          python3 -u one_file.py
